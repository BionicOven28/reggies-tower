<!DOCTYPE html>
<head>
    <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
    /*Reference Color Palette*/


    body {
        background-image: url('pics/bgs/pinkpastelrosesvertical.gif');
        background-repeat: repeat;

    }
    p {
        font-family: 'Roboto', sans-serif;
    }
    li {
        list-style-type: none;
        margin-bottom: 0.5rem;
    }
    button {
        display: block;
        background-color: white;
        color: black;
        border: 1px solid blue;
    }
    .breadcrumb {
        display: flex;
        justify-content: center;
        border: 1px solid red;
    }
    .title-box {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-flow: column nowrap;
        border: 1px solid blue;
    }
    .entry-list-box {
        display: flex;
        flex-flow: row nowrap;
        justify-content: center;
        padding: 1rem;
    }
    .tags {
        display: block;
    }
    /*Static Blog Entry Styles*/
     [id] {
	    display: none;
    }
        [id]:target {
            display: block;
        }
</style>
<script>
    window.onload=function(){
        const tags = document.querySelectorAll('#tags > button');
        const posts = document.querySelectorAll('#posts > div');
        const displayAll = document.getElementById('all');

        console.log(posts.length);

        displayAll.addEventListener('click', event => {
            for (let i = 0; i < posts.length; i++) {
                posts[i].style.display = "list-item";
            }
        });

        for (let i = 0; i < tags.length; i++) {
            /*when a tag button is clicked*/
            tags[i].addEventListener('click', event => {
            /*get the class of the clicked button*/
            const tagClass = event.target.className;

            /*loop through all posts*/
            for (let j = 0; j < posts.length; j++) {
                /*if the post has the same class as the clicked button, display it, otherwise hide it*/
                if (posts[j].classList.contains(tagClass)) {
                    posts[j].style.display = "list-item";
                } else {
                posts[j].style.display = "none";
                }
            }
        })
        };
    }
</script>
</head>
<body>
    <div class="breadcrumb">
        <a href="home.html">home</a> \ blog
    </div>

    <div class="title-box">
        <h1>the perks of being wallpaper</h1>
        <h3>welcome to my blog, where i ramble about nothing</h3>
    </div>

    <div class="tags">
        <strong>tag</strong><br>
        <span id="all"><button class="all">all tags</button></span>
        <span id="tags">
            <button class="gold-star">favorites</button>
            <button class="101">101 books</button>
            <button class="afm">appalachian folk magic</button>
            <button class="sfm">scottish folk magic</button>
            <button class="owned">books i own</button>
        </span>
    </div>
    <br>
    <div id="posts">
        <div class="gold-star">
            <h3>favorites</h3>
            <li><span><img src="#" href="link to book">1st favorite book</img><br>here's a brief description</span></li>
        </div>
    </div>

    <div class="entry-list-box">
        <a href="#1">Entry 01</a><br>
        <a href="#2">Entry 02</a><br>
        <a href="#3">Entry 03</a><br>
    </div>

    <div id="1"><p>This is the first entry.</p></div>
    <div id="2"><p>This is the second entry.</p></div>
    <div id="3"><p>This is the third entry.</p></div>
<script src="main.js"></script>
</body>
