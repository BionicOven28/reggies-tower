<style>
    /*Reference Color Palette*/


    /*Static Blog Entries Styles*/
    [id] {
	    display: none;
    }
    [id]:target {
        display:block;
    }
</style>
<script>
    const tags = document.querySelectorAll('#tags > button');
    const posts = document.querySelectorAll('#posts > div');
    const displayAll = document.getElementById('all');

    console.log(posts.length);

    displayAll.addEventListener('click', event => {
        for (let i = 0; i < posts.length; i++) {
            posts[i].style.display = "list-item";
        }
    });

    for (let i = 0; i < tags.length; i++) {
        /*when a tag button is clicked*/
        tags[i].addEventListener('click', event => {
        /*get the class of the clicked button*/
        const tagClass = event.target.className;

            /*loop through all posts*/
            for (let j = 0; j < posts.length; j++) {
                /*if the post has the same class as the clicked button, display it, otherwise hide it*/
                if (posts[j].classList.contains(tagClass)) {
                    posts[j].style.display = "list-item";
                } else {
                posts[j].style.display = "none";
                }
            }
        })
    };

</script>
</head>
