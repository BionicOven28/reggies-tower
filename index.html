        .glow1 {
            color: rgba(242, 232, 240, 100); /*Stone White*/
            text-shadow: 
                0 0 0.1rem rgb(242, 232, 240, 100), /*Stone White*/

            -webkit-animation: glow 3s ease-in-out infinite alternate;
            -moz-animation: glow 3s ease-in-out infinite alternate;
            animation: glow 3s ease-in-out infinite alternate; 
        }
            @keyframes glow {
                from {
                    text-shadow:

                        0 0 1rem rgb(126, 42, 83), /*Dark Raspberry*/

/*>>>   S Mobile -- min 350w x 480h*/
        @media (min-width: 350px) {
            html {
                scrollbar-color: rgba(115, 146, 181, 100) rgba(0, 0, 0, 0.65);
            }
            body { /*Mobile-Only Style*/

            a {

                padding: 0.15rem;

            }
                a:hover {
                    text-shadow: none;
                    letter-spacing: 0;
                }
            /*Mobile Nav Menu + Pop-Out, ***Only Visible on Mobile***/
            .menu-panel {
                position: fixed;
                z-index: 1;
                height: 100vh;
                width: 0;
                top: 0;
                left: 0;
                background-color: rgba(23, 24, 59, 0.80); /*Dark Blue*/
                overflow-x: hidden;
                padding-top: 20vh;
                transition: 0.35s;
            }
                .menu-panel a {

                    text-decoration: none;
                    padding: 0.5rem;
                    transition: 0.3s;
                }
            #bookbtn {

            .menu-panel .closebtn {

                margin-left: 1rem;

                font-size: 2.5rem; 
            }

            .body-box {
